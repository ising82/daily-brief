name: 每日財經晨報

on:
  schedule:
    - cron: "15 22 * * *"   # UTC 22:15 = 台灣 06:15（GitHub 排程常延遲 5–30 分鐘）
  workflow_dispatch:
    inputs:
      notify:
        description: "要發送 Telegram / LINE 推播嗎？"
        type: boolean
        default: true

permissions:
  contents: write   # 把每日資料存回 repo（也讓排程不會因 60 天無活動被停用）
  pages: write
  id-token: write

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - id: pages
        uses: actions/configure-pages@v5

      - name: 抓取資料、產生網站
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}
        run: python3 -m briefing build

      - name: 保存每日資料到 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git commit -m "晨報 $(TZ=Asia/Taipei date +%F)"; then
            git pull --rebase --autostash && git push
          else
            echo "資料沒有變更"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: 發送晨報（網站上線後才送，連結一定是最新的）
        if: github.event_name == 'schedule' || inputs.notify
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python3 -m briefing notify
